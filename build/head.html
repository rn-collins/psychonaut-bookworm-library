<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Serif+4:opsz,wght@8..60,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#F2EDE4;--ink:#1A1410;--forest:#2D5A1B;--sienna:#8B3A0F;--sage:#4A6741;--tan:#C4A882;--tan-text:#7e6034;--cream:#FAF7F2;--paper:#EDE8DF;--muted:#6B5E52;--rule:rgba(196,168,130,0.4)}
html{scroll-behavior:smooth}
body{background:var(--p);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;-webkit-font-smoothing:antialiased}
nav{position:sticky;top:0;z-index:100;background:rgba(242,237,228,0.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 2rem}
.brand{font-family:'Playfair Display',serif;font-size:0.95rem;font-weight:700;cursor:pointer}
.tab-bar{background:var(--cream);border-bottom:1px solid var(--rule);padding:0 2rem;display:flex;gap:0;overflow-x:auto;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-x pinch-zoom;-webkit-overflow-scrolling:touch}
.filter-bar{padding:0.6rem 2rem;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;gap:0.4rem;flex-wrap:wrap;align-items:center;position:sticky;top:94px;z-index:75}
.filter-pill{font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.07em;text-transform:uppercase;padding:0.28rem 0.65rem;border:1px solid var(--rule);background:var(--cream);color:var(--muted);cursor:pointer;white-space:nowrap;transition:all 0.15s}
.filter-pill:hover{background:var(--tan);color:var(--ink)}
.filter-pill.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.filter-sep{width:1px;height:1rem;background:var(--rule);flex-shrink:0;margin:0 0.2rem}
.filter-search{font-family:'JetBrains Mono',monospace;font-size:0.65rem;padding:0.28rem 0.65rem;border:1px solid var(--rule);background:var(--cream);color:var(--ink);outline:none;width:180px}
.filter-search::placeholder{color:var(--muted)}
.tab-bar::-webkit-scrollbar{display:none}
.tab{font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.07em;text-transform:uppercase;padding:0.75rem 1rem;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all 0.12s;display:flex;align-items:center;gap:0.4rem}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--sienna)}
.tab-count{background:var(--paper);border:1px solid var(--rule);padding:0.1em 0.35em;font-size:0.55rem}
.section{display:block;scroll-margin-top:104px;border-top:1px solid var(--rule)}
[hidden]{display:none!important}
.page-hero{padding:3rem 2.5rem 2rem;border-bottom:1px solid var(--rule)}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--sienna);margin-bottom:0.5rem}
.page-title{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;line-height:1.1;margin-bottom:0.6rem}
.page-sub{color:var(--muted);font-size:0.9rem;line-height:1.75;max-width:580px}
.wrap{max-width:1100px;margin:0 auto;padding:2rem 2.5rem 4rem}
.mono{font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted)}
.serif{font-family:'Playfair Display',serif}

/* READER */
.reader{display:none;position:fixed;inset:52px 0 0 0;background:var(--p);z-index:200;overflow-y:auto}
.reader.open{display:block}
.reader-inner{max-width:700px;margin:0 auto;padding:3rem 2.5rem 5rem}
.reader-back{font-family:'JetBrains Mono',monospace;font-size:0.62rem;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);cursor:pointer;margin-bottom:2rem;display:inline-block}
.reader-back:hover{color:var(--ink)}

/* OVERVIEW */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.9rem;margin-bottom:3rem}
.ov-card{background:var(--cream);border:1px solid var(--rule);padding:1.1rem;cursor:pointer;transition:transform 0.1s,box-shadow 0.1s}
.ov-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(26,20,16,0.08)}
.ov-card-held{cursor:default;background:var(--paper);opacity:.85}
.ov-card-held:hover{transform:none;box-shadow:none}
.ov-held{font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--sienna);margin-top:0.5rem}
.ov-n{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;line-height:1;margin-bottom:0.2rem}
.ov-label{font-size:0.85rem;font-weight:600;margin-bottom:0.1rem}
.ov-sub{font-family:'JetBrains Mono',monospace;font-size:0.55rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted)}

/* WRITING */
.fmt-bar{background:var(--cream);border-bottom:1px solid var(--rule);padding:0 2.5rem;display:flex;gap:0;position:sticky;top:94px;z-index:80;overflow-x:auto}
.fmt-tab{font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.07em;text-transform:uppercase;padding:0.75rem 1.1rem;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:0.35rem}
.fmt-tab:hover{color:var(--ink)}
.fmt-tab.active{color:var(--ink);border-bottom-color:var(--sienna)}
.fmt-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.art-row{display:grid;grid-template-columns:3px 1fr auto;cursor:pointer;transition:background 0.1s;border-bottom:1px solid var(--rule)}
.art-row:hover{background:var(--cream)}
.art-spine{}
.art-body{padding:1rem 1.25rem}
.art-meta{display:flex;gap:0.6rem;align-items:center;margin-bottom:0.3rem;flex-wrap:wrap}
.art-badge{font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.07em;text-transform:uppercase;padding:0.15em 0.45em;color:#fff}
.art-book{font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted)}
.art-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;line-height:1.3;margin-bottom:0.2rem}
.art-pull{font-size:0.8rem;color:var(--sienna);font-style:italic;line-height:1.5}
.art-right{padding:1rem 1.25rem 1rem 0;display:flex;flex-direction:column;align-items:flex-end;gap:0.3rem;min-width:100px}
.theme-pill{font-family:'JetBrains Mono',monospace;font-size:0.5rem;letter-spacing:0.05em;text-transform:uppercase;padding:0.12em 0.4em;background:var(--paper);border:1px solid var(--rule);color:var(--muted)}

/* QUOTE CARDS */
.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.1rem}
.q-card{background:var(--ink);padding:1.5rem;border-top:4px solid}
.q-text{font-family:'Source Serif 4','Georgia',serif;font-style:normal;font-size:1rem;line-height:1.65;margin-bottom:1rem;color:var(--paper);letter-spacing:0.01em}
.q-attr{font-family:'JetBrains Mono',monospace;font-size:0.62rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--tan-text);margin-bottom:0.5rem;font-weight:600}
.q-ctx{font-size:0.8rem;color:rgba(242,237,228,0.75);line-height:1.6;font-family:'Source Serif 4','Georgia',serif}

/* THEN VS NOW */
.tvn{background:var(--cream);border:1px solid var(--rule);overflow:hidden;margin-bottom:1.1rem}
.tvn-spine{height:3px}
.tvn-grid{display:grid;grid-template-columns:1fr 1fr}
.tvn-col{padding:1.1rem 1.25rem}
.tvn-col-then{border-right:1px solid var(--rule)}
.tvn-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;margin-bottom:0.5rem;line-height:1.3}
.tvn-text{font-size:0.82rem;line-height:1.65;color:var(--muted);font-style:italic}
.tvn-status{display:flex;align-items:center;gap:0.4rem;margin-bottom:0.4rem}
.tvn-dot{width:7px;height:7px;border-radius:50%}
.tvn-now{font-size:0.82rem;line-height:1.65;color:var(--ink)}

/* FLASHCARDS */
.fc-table{width:100%;border-collapse:collapse}
.fc-th{font-family:'JetBrains Mono',monospace;font-size:0.55rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding:0.45rem 0.9rem;text-align:left;border-bottom:1px solid var(--rule)}
.fc-row{border-bottom:1px solid var(--rule)}
.fc-row td{padding:0.8rem 0.9rem;vertical-align:top}
.fc-q{font-size:0.88rem;font-weight:600;line-height:1.4}
.fc-a{font-size:0.8rem;line-height:1.6;color:var(--muted)}
a.cite-link{color:var(--forest);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
a.cite-link:hover,a.cite-link:focus-visible{text-decoration-thickness:2px}
.fc-cite{font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:var(--tan-text);margin-top:0.25rem}
.fc-diff{font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.06em;text-transform:uppercase;padding:0.12em 0.4em;color:#fff}

/* SHARED CARD */
.card{background:var(--cream);border:1px solid var(--rule);padding:1.25rem;margin-bottom:1rem;border-left:3px solid}
.card-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;margin-bottom:0.4rem;line-height:1.3}
.card-body{font-size:0.85rem;line-height:1.7;color:var(--muted)}
.card-label{font-family:'JetBrains Mono',monospace;font-size:0.55rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--forest);margin:0.75rem 0 0.3rem}

/* DOCUMENTS */
.doc{background:var(--cream);border:1px solid var(--rule);margin-bottom:1.1rem;overflow:hidden}
.doc-head{padding:1.1rem 1.25rem;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start}
.doc-type{font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.08em;text-transform:uppercase;padding:0.12em 0.45em;border:1px solid var(--rule);color:var(--muted)}
.doc-date{font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:var(--muted);letter-spacing:0.04em}
.doc-grid{display:grid;grid-template-columns:1fr 1fr}
.doc-col{padding:1.1rem 1.25rem}
.doc-col-left{border-right:1px solid var(--rule);background:rgba(242,237,228,0.5)}
.doc-excerpt{font-family:'Playfair Display',serif;font-style:italic;font-size:0.82rem;line-height:1.6;border-left:2px solid var(--tan);padding-left:0.9rem;color:var(--muted)}

/* CHARACTERS */
.char{background:var(--cream);border:1px solid var(--rule);margin-bottom:1.1rem;overflow:hidden}
.char-head{padding:1.1rem 1.25rem;border-bottom:1px solid var(--rule);display:flex;align-items:start;gap:1rem}
.char-name-wrap{flex:1}
.char-name{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700}
.char-role{font-size:0.82rem;color:var(--muted);margin-top:0.2rem}
.char-era{font-family:'JetBrains Mono',monospace;font-size:0.55rem;letter-spacing:0.05em;color:var(--tan-text)}
.char-grid{display:grid;grid-template-columns:1fr 1fr 1fr}
.char-col{padding:0.9rem 1.25rem;border-right:1px solid var(--rule);font-size:0.82rem;line-height:1.65}
.char-col:last-child{border-right:none}
.char-col-label{font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--forest);margin-bottom:0.3rem}
.char-quote{font-family:'Playfair Display',serif;font-style:italic;font-size:0.85rem;line-height:1.55;border-left:2px solid var(--sienna);padding-left:0.75rem;color:var(--sienna)}

/* PASSAGES */
.passage{background:var(--cream);border:1px solid var(--rule);margin-bottom:1.1rem;overflow:hidden}
.passage-head{padding:1.1rem 1.25rem;border-bottom:1px solid var(--rule)}
.passage-excerpt{padding:1.1rem 1.25rem;background:rgba(242,237,228,0.5);border-bottom:1px solid var(--rule);font-family:'Playfair Display',serif;font-style:italic;font-size:0.85rem;line-height:1.65;border-left:3px solid var(--tan)}
.passage-grid{display:grid;grid-template-columns:1fr 1fr}
.passage-col{padding:1rem 1.25rem;font-size:0.82rem;line-height:1.7;color:var(--muted)}
.passage-col:first-child{border-right:1px solid var(--rule)}

/* GEOGRAPHY */
.geo{background:var(--cream);border:1px solid var(--rule);margin-bottom:1.1rem;overflow:hidden}
.geo-head{padding:1.1rem 1.25rem;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;align-items:start}
.geo-location{font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.04em;color:var(--muted);margin-top:0.2rem}
.geo-body{padding:1.1rem 1.25rem;font-size:0.85rem;line-height:1.8;color:var(--ink)}
.geo-/* --tan-text is tuned for the cream grounds, where it reads 4.99:1. On the
   near-black footer the same brown is 3.14:1, so the token is lifted here
   rather than changed globally — lightening it everywhere broke 84 nodes
   on cream. */
footer{--tan-text:#9e8766}
footer{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.geo-fact{padding:0.9rem 1.25rem;font-size:0.8rem;line-height:1.6;color:var(--muted)}
.geo-fact:first-child{border-right:1px solid var(--rule)}

/* BRIDGES */
.bridge{background:var(--cream);border:1px solid var(--rule);margin-bottom:1.1rem;overflow:hidden}
.bridge-head{padding:1.1rem 1.25rem;border-bottom:1px solid var(--rule)}
.bridge-books{display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.5rem}
.bridge-book-tag{font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.05em;text-transform:uppercase;padding:0.15em 0.5em;border-left:2px solid}
.bridge-premise{font-size:0.85rem;font-style:italic;color:var(--sienna);line-height:1.55;margin-bottom:0;padding:0 1.25rem 0}
.bridge-body{padding:1.1rem 1.25rem;font-size:0.84rem;line-height:1.8;color:var(--muted)}
.bridge-body p{margin-bottom:0.9rem}
.bridge-body p:last-child{margin-bottom:0}

/* READING LISTS */
.rl{background:var(--cream);border:1px solid var(--rule);margin-bottom:1.1rem;overflow:hidden}
.rl-head{padding:1.1rem 1.25rem;border-bottom:1px solid var(--rule)}
.rl-intro{padding:0.9rem 1.25rem;background:rgba(242,237,228,0.5);border-bottom:1px solid var(--rule);font-size:0.82rem;color:var(--muted);line-height:1.65;font-style:italic}
.rl-entry{display:grid;grid-template-columns:auto 1fr;gap:0.75rem;padding:0.75rem 1.25rem;border-bottom:1px solid var(--rule);align-items:start}
.rl-entry:last-child{border-bottom:none}
.rl-order{font-family:'JetBrains Mono',monospace;font-size:0.55rem;letter-spacing:0.05em;text-transform:uppercase;padding:0.15em 0.45em;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.rl-title{font-size:0.88rem;font-weight:600;margin-bottom:0.15rem}
.rl-author{font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:var(--muted);letter-spacing:0.03em}
.rl-why{font-size:0.8rem;color:var(--muted);line-height:1.55;margin-top:0.2rem}

/* ANNOTATIONS */
.ann{background:var(--cream);border:1px solid var(--rule);margin-bottom:0.9rem;overflow:hidden}
.ann-head{padding:0.9rem 1.25rem;border-bottom:1px solid var(--rule);display:flex;align-items:start;gap:0.75rem}
.ann-verdict{font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.07em;text-transform:uppercase;padding:0.15em 0.5em;color:#fff;flex-shrink:0;margin-top:0.2rem}
.ann-claim{font-size:0.88rem;font-weight:600;line-height:1.4}
.ann-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.ann-col{padding:0.9rem 1.25rem;font-size:0.8rem;line-height:1.65;color:var(--muted)}
.ann-col:first-child{border-right:1px solid var(--rule)}
.ann-col-label{font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.07em;text-transform:uppercase;color:var(--forest);margin-bottom:0.3rem}
.conf{font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.05em;text-transform:uppercase;padding:0.12em 0.4em;border:1px solid var(--rule);color:var(--muted)}

/* NOTEBOOKLM */
.nlm{background:var(--cream);border:1px solid var(--rule);margin-bottom:1.1rem;overflow:hidden}
.nlm-head{padding:1.1rem 1.25rem;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;align-items:start}
.nlm-series{font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);margin-bottom:0.3rem}
.nlm-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700}
.nlm-len{font-family:'JetBrains Mono',monospace;font-size:0.58rem;color:var(--muted);letter-spacing:0.04em}
.nlm-body{padding:1.1rem 1.25rem}
.nlm-instructions{background:rgba(26,20,16,0.04);border:1px solid var(--rule);padding:0.9rem;margin-bottom:0.9rem;font-family:'JetBrains Mono',monospace;font-size:0.7rem;line-height:1.6;color:var(--muted);white-space:pre-wrap}
.nlm-qs{margin-top:0.9rem}
.nlm-q{display:flex;gap:0.5rem;margin-bottom:0.4rem;align-items:flex-start}
.nlm-q-num{font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:var(--sienna);flex-shrink:0;margin-top:0.1rem}
.nlm-q-text{font-size:0.8rem;color:var(--muted);line-height:1.5}
.nlm-source{background:rgba(26,20,16,0.03);border:1px solid var(--rule);padding:0.75rem;margin-bottom:0.75rem;font-size:0.78rem;line-height:1.65;color:var(--muted);max-height:180px;overflow:hidden;position:relative}
.nlm-source-fade{position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(transparent, var(--cream))}
.nlm-toggle{font-family:'JetBrains Mono',monospace;font-size:0.58rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--forest);cursor:pointer;margin-top:0.4rem;display:inline-block}
.nlm-guest{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--forest);letter-spacing:0.03em;margin-top:0.5rem;font-style:italic}

.truth-panel{margin:1.25rem 0;padding:1rem 1.1rem;border:1px solid var(--rule);border-left:4px solid var(--forest);background:var(--cream);font-size:.82rem;line-height:1.65}
.research-controls{display:grid;grid-template-columns:minmax(220px,1fr) 180px 180px auto;gap:.55rem;margin:1rem 0}
.research-controls input,.research-controls select{font:inherit;padding:.65rem;border:1px solid var(--rule);background:var(--cream);color:var(--ink)}
.research-results{display:grid;gap:.65rem}
.research-item{border:1px solid var(--rule);background:var(--cream);padding:1rem;display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start}
.research-item h3{font-family:'Playfair Display',serif;font-size:1.05rem;margin:.2rem 0}
.research-meta{font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.queue-btn{border:1px solid var(--forest);background:transparent;color:var(--forest);padding:.45rem .65rem;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.58rem;text-transform:uppercase}
.queue-btn.saved{background:var(--forest);color:#fff}
.ledger{width:100%;border-collapse:collapse;margin-top:1rem;font-size:.78rem}.ledger th,.ledger td{text-align:left;border-bottom:1px solid var(--rule);padding:.65rem}.ledger th{font-family:'JetBrains Mono',monospace;font-size:.57rem;text-transform:uppercase;color:var(--muted)}
